<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 240px; margin: 12px; color: #1c1e21; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  .stats { margin: 10px 0; padding: 8px; background: #f0f2f5; border-radius: 6px; }
  .stats div { display: flex; justify-content: space-between; }
  .muted { color: #65676b; }
  a { color: #1877f2; }
</style>
</head>
<body>
  <h1>Feed Ad Hider</h1>
  <label><input type="checkbox" id="enabled"> Enabled</label>
  <label><input type="checkbox" id="hideSuggested"> Also hide “Suggested” posts</label>
  <div class="stats" id="stats"><span class="muted">Open Facebook to see stats.</span></div>
  <p><a href="#" id="opts">Settings…</a></p>
  <script src="popup.js"></script>
</body>
</html>
