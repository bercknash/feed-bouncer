<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Feed Ad Hider settings</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1c1e21; }
  h1 { font-size: 20px; }
  label { display: block; margin: 10px 0; }
  .muted { color: #65676b; font-size: 13px; }
</style>
</head>
<body>
  <h1>Feed Ad Hider</h1>
  <label><input type="checkbox" id="enabled"> Hide sponsored posts</label>
  <label><input type="checkbox" id="hideSuggested"> Also hide “Suggested for you” posts and Reels / People-you-may-know rows</label>
  <label><input type="checkbox" id="showPlaceholder"> Leave a small “Ad hidden · click to show” bar where a post was hidden</label>
  <label><input type="checkbox" id="debug"> Debug: outline checked posts and log decisions to the page console</label>
  <p class="muted">Changes apply immediately. This extension makes no network requests and collects no data;
    these four settings are the only thing it stores.</p>
  <script src="options.js"></script>
</body>
</html>
